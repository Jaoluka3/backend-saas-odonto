services:
  - type: web
    name: backend-saas-odonto-api
    runtime: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python3 -m uvicorn main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
  - type: worker
    name: backend-saas-odonto-bot
    runtime: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python3 bot_telegram.py"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0